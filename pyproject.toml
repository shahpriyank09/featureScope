[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-feature-scope"
version = "0.1.0"
description = "Turn pull requests into evidence-backed visual explanations."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27.0,<1",
  "pydantic>=2.8.0,<3",
  "pydantic-settings>=2.4.0,<3",
  "python-dotenv>=1.0.1,<2",
  "rich>=13.8.0,<15",
  "streamlit>=1.38.0,<2",
  "typer>=0.12.5,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-cov>=5.0.0,<8",
]
slides = [
  "python-pptx>=1.0.2,<2",
]

[project.scripts]
prism = "prism.cli:app"
prism-evals = "prism.evals:main"

[tool.hatch.build.targets.wheel]
packages = ["prism"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
